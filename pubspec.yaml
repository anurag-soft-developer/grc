name: grc
description: GRC runs mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  flutter_query: ^0.7.0
  flutter_hooks: ^0.21.2
  dart_mappable: ^4.5.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  validators: ^3.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  cross_file: ^0.3.5+2
  fluttertoast: ^8.2.12
  geolocator: ^13.0.2
  razorpay_flutter: ^1.4.4
  intl: ^0.20.2
  url_launcher: ^6.3.1
  android_intent_plus: ^5.3.0
  flutter_svg: ^2.2.1
  flutter_breadcrumb: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  dart_mappable_builder: ^4.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logos/grc_logo.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: '#0B1220'
  image: assets/logos/grc_logo.png
  android_12:
    color: '#0B1220'
    image: assets/logos/grc_logo.png
